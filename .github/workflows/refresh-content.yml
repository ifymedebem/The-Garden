name: Refresh source snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run ingest
      - run: npm run check
      - name: Commit valid source snapshot
        run: |
          git config user.name garden-content-bot
          git config user.email garden-content-bot@users.noreply.github.com
          git add dist/content.json
          git diff --staged --quiet || git commit -m "Refresh validated source snapshot"
          git push
